services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mingly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mingly_dev_password}
      POSTGRES_DB: mingly
    # No host port exposed - only the backend container needs to reach this,
    # via the internal Docker network at hostname "db:5432". This also avoids
    # port collisions with other Postgres instances on a shared server.
    volumes:
      - mingly_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mingly"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    # Host port 3000 is already used by another project on this shared
    # server (see docs/deployment-log.md) - 3010 matches what nginx
    # already routes to (infrastructure/nginx/mingly-ai.conf).
    ports:
      - "3010:3000"

volumes:
  mingly_pg_data:
