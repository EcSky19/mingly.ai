# Production overlay: adds Caddy in front of the app services defined in
# the root docker-compose.yml. Run on the Hetzner server as:
#   docker compose -f docker-compose.yml -f infrastructure/docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
