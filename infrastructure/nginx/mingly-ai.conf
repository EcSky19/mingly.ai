# nginx server block for www.mingly.ai / mingly.ai
#
# This server shares a Hetzner box with other projects (CareerRadar, sma-engine,
# taengine), which already own nginx and ports 80/443. This config only adds a
# new server_name block - it does not modify any existing site config.
#
# Deployed at: /etc/nginx/sites-available/mingly-ai
# Enabled via: /etc/nginx/sites-enabled/mingly-ai (symlink)
#
# The frontend container runs on host port 3010 (chosen because 3000, 3001,
# and 8000 were already in use by other projects on this box).

server {
    listen 80;
    server_name mingly.ai www.mingly.ai;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After DNS propagates, this block gets TLS added automatically by:
#   certbot --nginx -d mingly.ai -d www.mingly.ai
