# nginx server block for www.mingly.ai / mingly.ai
#
# This server shares a Hetzner box with other projects (CareerRadar, sma-engine,
# taengine), which already own nginx and ports 80/443. This config only adds a
# new server_name block - it does not modify any existing site config.
#
# Deployed at: /etc/nginx/sites-available/mingly-ai
# Enabled via: /etc/nginx/sites-enabled/mingly-ai (symlink)
#
# Host port allocation on this shared server (avoids collisions with other
# projects already using 3000, 3001, 5432, 8000):
#   Frontend container: 3010
#   Backend container:  8010
#   Postgres:            not exposed to host at all - internal Docker network only

server {
    listen 80;
    server_name mingly.ai www.mingly.ai;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TLS already issued via:
#   certbot --nginx -d mingly.ai -d www.mingly.ai
# Certbot will have added its own server block additions above this comment
# automatically - do not remove those when editing this file.
